services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER:-airflow}:${AIRFLOW_DB_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_CONN_SPARK_DEFAULT: spark://spark%3A%2F%2Fspark-master%3A7077
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./spark_jobs:/opt/airflow/spark_jobs
      - ./data:/opt/airflow/data
    command: >-
      bash -c "airflow db migrate &&
      (airflow users create --username admin --password admin
      --firstname Local --lastname Admin --role Admin
      --email admin@example.com || true)"

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    environment:
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./data:/opt/airflow/data
    ports:
      - "7077:7077"
      - "8081:8080"

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./data:/opt/airflow/data
    environment:
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/datalake"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-analytics}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
    ports:
      - "8123:8123"
      - "19000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20

  superset-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${SUPERSET_DB_USER:-superset}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD:-superset}
      POSTGRES_DB: ${SUPERSET_DB_NAME:-superset}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      timeout: 5s
      retries: 12

  superset-init:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    depends_on:
      superset-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment: &superset-environment
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_DATABASE_URI: postgresql+psycopg2://${SUPERSET_DB_USER:-superset}:${SUPERSET_DB_PASSWORD:-superset}@superset-db:5432/${SUPERSET_DB_NAME:-superset}
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-local-development-secret}
    volumes: &superset-volumes
      - ./docker/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    command: >-
      sh -c "superset db upgrade &&
      (superset fab create-admin --username ${SUPERSET_ADMIN_USER:-admin} --firstname Local
      --lastname Admin --email ${SUPERSET_ADMIN_EMAIL:-admin@example.com} --password ${SUPERSET_ADMIN_PASSWORD:-admin} || true) &&
      superset init"

  superset:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment: *superset-environment
    volumes: *superset-volumes
    ports:
      - "8088:8088"
    command: superset run -h 0.0.0.0 -p 8088
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8088/health"]
      interval: 10s
      timeout: 10s
      retries: 12

  superset-datasource-init:
    build:
      context: .
      dockerfile: docker/superset/Dockerfile
    depends_on:
      superset:
        condition: service_healthy
    environment:
      SUPERSET_URL: http://superset:8088
      SUPERSET_USERNAME: ${SUPERSET_ADMIN_USER:-admin}
      SUPERSET_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      CLICKHOUSE_DATABASE_NAME: ClickHouse Analytics
      CLICKHOUSE_SQLALCHEMY_URI: clickhousedb://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-clickhouse}@clickhouse:8123/${CLICKHOUSE_DB:-analytics}
    volumes:
      - ./docker/superset/bootstrap_clickhouse.py:/app/bootstrap_clickhouse.py:ro
    command: python /app/bootstrap_clickhouse.py

volumes:
  postgres_data:
  minio_data:
  clickhouse_data:
  superset_db_data: